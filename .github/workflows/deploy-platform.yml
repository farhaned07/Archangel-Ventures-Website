name: Deploy Archangel Platform

on:
  workflow_dispatch:
    inputs:
      environment_url:
        description: Target Power Platform environment URL
        required: true
      environment_name:
        description: GitHub environment name
        required: true
        default: sandbox
      solution_zip:
        description: Managed solution path
        required: true
        default: platform/power-platform/dist/ArchangelAP_managed.zip

jobs:
  deploy:
    runs-on: windows-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Power Platform CLI
        shell: pwsh
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool
      - name: Generate deployment settings
        shell: pwsh
        run: node platform/cli.mjs
      - name: Deploy managed solution
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          PP_APPLICATION_ID: ${{ secrets.PP_APPLICATION_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
        run: |
          ./platform/scripts/deploy-sandbox.ps1 `
            -EnvironmentUrl "${{ inputs.environment_url }}" `
            -TenantId "$env:PP_TENANT_ID" `
            -ApplicationId "$env:PP_APPLICATION_ID" `
            -ClientSecret "$env:PP_CLIENT_SECRET" `
            -SolutionZip "${{ inputs.solution_zip }}"
      - name: Validate deployment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          PP_APPLICATION_ID: ${{ secrets.PP_APPLICATION_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
        run: |
          ./platform/scripts/validate-environment.ps1 `
            -EnvironmentUrl "${{ inputs.environment_url }}" `
            -TenantId "$env:PP_TENANT_ID" `
            -ApplicationId "$env:PP_APPLICATION_ID" `
            -ClientSecret "$env:PP_CLIENT_SECRET"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-validation
          path: platform/output/validation-report.json
