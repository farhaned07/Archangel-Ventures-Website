name: Archangel Platform CI

on:
  pull_request:
    paths:
      - "platform/**"
      - "package.json"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:platform
      - run: npm run platform:generate
      - uses: actions/upload-artifact@v4
        with:
          name: archangel-platform-generated-assets
          path: platform/output/
